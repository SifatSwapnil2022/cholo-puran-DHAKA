name: Check data

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate places.json
        run: node tools/validate.mjs
      - name: Place pages are up to date
        run: |
          node tools/build-pages.mjs
          if [ -n "$(git status --porcelain -- place history sitemap.xml robots.txt)" ]; then
            git status --short -- place history sitemap.xml robots.txt
            echo "::error::Place pages are out of date. Run 'node tools/build-pages.mjs' and commit the result."
            exit 1
          fi
